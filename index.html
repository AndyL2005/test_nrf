<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nRF52 BLE Logger</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        .input-group label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 15px 30px; margin: 10px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; }
        #connectBtn { background-color: #007bff; color: white; }
        /* The button is now permanently visible because display: none; was removed */
        #saveBtn { background-color: #28a745; color: white; } 
        #log { margin-top: 20px; text-align: left; height: 300px; overflow-y: scroll; background: #f4f4f4; padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <h2>BLE Sensor Logger</h2>
    
    <div class="input-group">
        <label for="serviceUuid">Service UUID:</label>
        <input type="text" id="serviceUuid" value="19b10000-e8f2-537e-4f6c-d104768a1214">
    </div>
    <div class="input-group">
        <label for="charUuid">Characteristic UUID:</label>
        <input type="text" id="charUuid" value="19b10001-e8f2-537e-4f6c-d104768a1214">
    </div>

    <button id="connectBtn">Connect to Device</button>
    <button id="saveBtn">Save to CSV</button>
    
    <div id="log">Waiting for configuration...</div>

    <script>
        let sensorData = [["Index", "Data"]]; // CSV Headers
        let logDiv = document.getElementById('log');

        document.getElementById('connectBtn').addEventListener('click', async () => {
            const targetServiceUuid = document.getElementById('serviceUuid').value.trim().toLowerCase();
            const targetCharUuid = document.getElementById('charUuid').value.trim().toLowerCase();

            if (!targetServiceUuid || !targetCharUuid) {
                logDiv.innerHTML = "<span style='color:red'>Error: Please enter both UUIDs.</span><br>";
                return;
            }

            try {
                logDiv.innerHTML = "Requesting Bluetooth Device...<br>";
                
                // Temporarily allow all devices so we can see the cached name
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [targetServiceUuid]
                });

                logDiv.innerHTML += `Connecting to GATT Server on ${device.name}...<br>`;
                const server = await device.gatt.connect();

                logDiv.innerHTML += "Getting Service...<br>";
                const service = await server.getPrimaryService(targetServiceUuid);

                logDiv.innerHTML += "Getting Characteristic...<br>";
                const characteristic = await service.getCharacteristic(targetCharUuid);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                logDiv.innerHTML += "<span style='color:green'><b>Listening for data...</b></span><br>";

            } catch (error) {
                logDiv.innerHTML += "<span style='color:red'>Error: " + error.message + "</span><br>";
            }
        });

        function handleData(event) {
            const decoder = new TextDecoder('utf-8');
            const valueStr = decoder.decode(event.target.value);
            
            logDiv.innerHTML += `Received: ${valueStr}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;

            const parts = valueStr.split(',');
            if(parts.length >= 2) {
                sensorData.push([parts[0], parts[1]]);
            } else {
                sensorData.push([sensorData.length, valueStr]); 
            }
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            // 1. Format the CSV string
            let csvContent = "";
            sensorData.forEach(rowArray => {
                let row = rowArray.join(",");
                csvContent += row + "\r\n";
            });

            // 2. Try using the native iOS Share Sheet first (for Bluefy)
            if (navigator.share) {
                try {
                    const file = new File([csvContent], "ble_sensor_data.csv", { type: "text/csv" });
                    await navigator.share({
                        title: 'Export Sensor Data',
                        files: [file]
                    });
                    return; // Stop here if the share sheet successfully opens
                } catch (err) {
                    console.log("Share sheet canceled or failed.");
                }
            }

            // 3. Fallback for Windows/Mac computers (if the Share Sheet isn't supported)
            const encodedUri = "data:text/csv;charset=utf-8," + encodeURIComponent(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "ble_sensor_data.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
